[package]
name = "slackinux"
version = "0.4.0"
edition = "2021"
description = "An unofficial, resource-conscious Linux desktop shell for Slack Web."
authors = ["Knownassa"]
license = "MIT"
repository = "https://github.com/Knownassa/Slackinux"
homepage = "https://github.com/Knownassa/Slackinux"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
notify-rust = "4"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.10.1"
url = "2"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# v2_34 exposes the media-capture state signals and the display-device
# permission check required by the Phase 4 permission broker.
webkit2gtk = { version = "2.0", features = ["v2_34"] }
javascriptcore-rs = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# XDG Desktop Portal access for external link/app opening. The tokio feature
# matches Tauri's async runtime so block_on can drive the portal call.
ashpd = { version = "0.8", default-features = false, features = ["tokio"] }
