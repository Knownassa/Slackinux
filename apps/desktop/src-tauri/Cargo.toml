[package]
name = "slackinux"
version = "0.2.1"
edition = "2021"
description = "An unofficial, resource-conscious Linux desktop shell for Slack Web."
license = "MIT"
repository = "https://github.com/Knownassa/Slackinux"
homepage = "https://github.com/Knownassa/Slackinux"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
notify-rust = "4"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.10.1"
url = "2"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
javascriptcore-rs = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
