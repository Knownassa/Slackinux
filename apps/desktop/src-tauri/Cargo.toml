[package]
name = "slackinux"
version = "0.4.0"
edition = "2021"
description = "An unofficial, resource-conscious Linux desktop shell for Slack Web."
authors = ["Knownassa"]
license = "MIT"
repository = "https://github.com/Knownassa/Slackinux"
homepage = "https://github.com/Knownassa/Slackinux"

[features]
# Experimental CEF (Chromium Embedded Framework) renderer backend. NOT the
# default and NOT end-to-end verified. Enabling this only compiles the
# renderer/cef.rs scaffold; actually running on CEF additionally requires
# patching the whole tauri stack onto the experimental `feat/cef` branch
# (see the module docs) and bundling the ~150MB CEF framework.
cef = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
notify-rust = "4"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.10.1"
url = "2"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# v2_34 exposes the media-capture state signals and the display-device
# permission check required by the Phase 4 permission broker.
webkit2gtk = { version = "2.0", features = ["v2_34"] }
javascriptcore-rs = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# XDG Desktop Portal access for external link/app opening. The tokio feature
# matches Tauri's async runtime so block_on can drive the portal call.
ashpd = { version = "0.8", default-features = false, features = ["tokio"] }

# --- Experimental CEF backend: how to actually assemble it (see renderer/cef.rs) ---
# A `[patch.crates-io]` section is global to the workspace, so it must be
# applied deliberately and with an exact pinned commit, the same way the
# webkit2gtk `v2_34` feature above is a documented requirement.
#
# Uncomment only to build the CEF backend. The patch replaces the stock tauri
# stack with the experimental `feat/cef` branch; `cargo build --features cef`
# then produces a Chromium-backed build.
#
# [patch.crates-io]
# tauri = { git = "https://github.com/tauri-apps/tauri", rev = "4af26a3f7f8b692d62cca549bbacd93f5ce90b41" }
