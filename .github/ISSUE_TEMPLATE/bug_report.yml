name: Bug report
description: Report a reproducible problem with Slackinux
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Slackinux. Use **Help → Diagnostics → Copy Diagnostic Info** in the app, then paste the result below. Never post Slack cookies, tokens, or private workspace content.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you were doing when it occurred.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Slackinux diagnostics
      description: Paste the output from Help → Diagnostics → Copy Diagnostic Info.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpt
      description: Optional. Review the log before pasting it and remove anything private.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed private workspace information, cookies, and tokens.
          required: true
