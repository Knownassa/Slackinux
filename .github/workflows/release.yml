name: Publish Linux release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file \
            rpm

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Test
        run: |
          cargo fmt --all -- --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Check version consistency
        run: bash scripts/check-version-consistency.sh

      - name: Build and publish signed installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: "Slackinux v__VERSION__"
          releaseBody: |
            Download the Debian package for Debian/Ubuntu, RPM for Fedora/RHEL/openSUSE,
            or the AppImage for other Linux distributions. A POSIX shell installer is
            also available from the repository README.

            Existing updater-enabled installations will be notified automatically.
          releaseDraft: true
          prerelease: false
          args: "--bundles appimage,deb,rpm"
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

      # tauri-action writes GitHub API asset URLs into latest.json. Those URLs
      # can return 403 to unauthenticated desktop clients, so publish stable,
      # public release-download URLs instead.
      - name: Normalize updater download URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_dir="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" \
            --pattern latest.json \
            --dir "$release_dir"
          # The releases/tags API returns 404 for drafts. `gh release view`
          # resolves draft tags and exposes each asset's API URL.
          gh release view "$GITHUB_REF_NAME" --json assets \
            > "$release_dir/release.json"

          base_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"
          jq \
            --slurpfile release "$release_dir/release.json" \
            --arg base_url "$base_url" \
            '($release[0].assets | map({key: .apiUrl, value: .name}) | from_entries) as $names
             | .platforms |= with_entries(.value.url = ($base_url + $names[.value.url]))' \
            "$release_dir/latest.json" \
            > "$release_dir/latest.fixed.json"
          mv "$release_dir/latest.fixed.json" "$release_dir/latest.json"

          jq -e \
            --arg base_url "$base_url" \
            'all(.platforms[]; .url | startswith($base_url))' \
            "$release_dir/latest.json" \
            > /dev/null
          gh release upload "$GITHUB_REF_NAME" \
            "$release_dir/latest.json" \
            --clobber
